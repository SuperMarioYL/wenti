# 风格评分 rubric — 三联生活周刊体
# 这是 Wenti 的护城河：把"文风"量化成可证伪的 0-5 子分，让 bare-model 输出
# 和 文体-pack 输出在同一套尺子上可比。
#
# 维度与权重取自 mvp_plan.md §2（hash-locked），权重和 = 1.0。

version: 1
pack: sanlian
scale: { min: 0, max: 5 }

dimensions:
  句式:
    weight: 0.3
    desc: "句子结构：长短交替、从句铺陈、排比与设问；拒绝通篇陈述短句。"
    pass:   "长短句交替，至少一处从句铺陈或排比，节奏有起伏。"
    fail:   "全篇陈述短句或全篇长句堆砌，节奏平直。"
    anchors: ["从句", "排比", "设问", "长短交替", "顿挫"]
  用词:
    weight: 0.3
    desc: "用词：具象、感官、文学性；拒绝 AI-slop 套话。"
    pass:   "具象名词与感官动词为主，细节先于判断。"
    fail:   "通篇 抽象/套话（综上所述/在当今社会/随着……的发展）。"
    anchors: ["具象", "感官", "细节", "文学性"]
    slop_markers: ["综上所述", "总而言之", "首先", "其次", "最后", "在当今社会", "随着.*的发展", "众所周知", "不可否认", "综上所述"]
  节奏:
    weight: 0.2
    desc: "段落与停顿：长短段起伏，靠停顿制造重量。"
    pass:   "段长起伏明显，有短段收束或单句成段。"
    fail:   "段长均匀，信息流平推无停顿。"
    anchors: ["短段收束", "起伏", "停顿", "单句成段"]
  视角:
    weight: 0.2
    desc: "视角：第一人称旁观、具体时空坐标；拒绝无立场全知。"
    pass:   "第一人称旁观 + 具体时间/地点/人名坐标。"
    fail:   "无立场的全知概述，无具体坐标。"
    anchors: ["第一人称", "旁观", "具体时空", "人名"]

# rewrite 建议的生成约束（prompt.py 用）
rewrite_constraints:
  max_suggestions: 3
  must_be_voiced: true        # 建议必须是三联体 voiced 的重写片段，不是泛泛建议
  cite_dim: true              # 每条建议必须指向一个维度
